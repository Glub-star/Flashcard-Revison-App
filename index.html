<!DOCTYPE html>
<html lang="en">
<head class="hero">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Flashcard revision app</title>
</head>

<body>
    <label
  for="themeToggle"
  class="themeToggle st-sunMoonThemeToggleBtn"
  type="checkbox"
>
  <input type="checkbox" id="themeToggle" class="themeToggleInput" />
  <svg
    width="18"
    height="18"
    viewBox="0 0 20 20"
    fill="currentColor"
    stroke="none"
  >
    <mask id="moon-mask">
      <rect x="0" y="0" width="20" height="20" fill="white"></rect>
      <circle cx="11" cy="3" r="8" fill="black"></circle>
    </mask>
    <circle
      class="sunMoon"
      cx="10"
      cy="10"
      r="8"
      mask="url(#moon-mask)"
    ></circle>
    <g>
      <circle class="sunRay sunRay1" cx="18" cy="10" r="1.5"></circle>
      <circle class="sunRay sunRay2" cx="14" cy="16.928" r="1.5"></circle>
      <circle class="sunRay sunRay3" cx="6" cy="16.928" r="1.5"></circle>
      <circle class="sunRay sunRay4" cx="2" cy="10" r="1.5"></circle>
      <circle class="sunRay sunRay5" cx="6" cy="3.1718" r="1.5"></circle>
      <circle class="sunRay sunRay6" cx="14" cy="3.1718" r="1.5"></circle>
    </g>
  </svg>
</label>
    <main class="app">
        <section id="home" class="page active">
        <header class="card">
            <h1>Flashcard revision app</h1>
            <h2>Our solution to traditional studying</h2>
        </header>
        <button class="btn" id="view-btn">View flashcards</button>
        <button class="btn secondary" id="manage-btn">Manage cards</button>
    </section>

    <section id="pack-picker" class="page">
        <h2 class="card">Choose a pack</h2>
        <ul id="pack-choices" class="card-list"></ul>
        <button class="btn secondary" id="picker-back-btn">Back to home</button>
    </section>

    <section id="study" class="page">
        <div class="deck" id="deck">
            <div class="stack-card stack-3"></div>
            <div class="stack-card stack-2"><p id="next-text"></p></div>

            <div class="flip-card" id="flashcard" role="button" tabindex="0" aria-label="Flashcard, press to flip">
                <div class="flip-inner">
                    <div class="face front"><p id="front-text"></p></div>
                    <div class="face back"><p id="back-text"></p></div>
                </div>
            </div>
        </div>
        <div id="progress">
            <div id="progress-track">
                <div id="progress-fill"></div>
            </div>
            <p id="counter"></p>
        </div>
        <p id="flip-hint">Tap the card to flip · swipe to change card</p>
        <div class="controls">
            <button class="btn" id="prev">Previous</button>
            <button class="btn" id="flip">Flip</button>
            <button class="btn" id="next">Next</button>
        </div>
        <button class="btn secondary" id="back-btn">Back to home</button>
    </section>

    <section id="manage" class="page">
        <h2 class="card">Manage cards</h2>

        <label for="pack-select">Flashcard pack</label>
        <select id="pack-select"></select>

        <div class="add-card">
            <input id="question" placeholder="Question" maxlength="200">
            <input id="answer" placeholder="Answer" maxlength="200">
            <p id="error" class="error" role="alert"></p>
            <button class="btn" id="add-btn">Add card</button>
        </div>

        <ul id="card-list" class="card-list"></ul>

        <button class="btn" id="manage-back-btn">Back to home</button>
    </section>

    <section id="new-pack" class="page">
        <h2 class="card">Create a pack</h2>
        <div class="add-card">
            <input id="new-pack-name" placeholder="New pack name" maxlength="40">
            <button class="btn" id="add-pack-btn">Create pack</button>
        </div>
    </section>

</main>

<script src="js/app.js"></script>
</body>
</html>
